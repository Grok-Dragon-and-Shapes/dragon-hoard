<!DOCTYPE html>
<html lang='ru'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Логово дракона: сокровища</title>
<link rel='stylesheet' href='style.css'>
</head>
<body>
<main class='layout'>
  <header>
    <h1>Логово дракона</h1>
    <p class='sub'>Сокровища по биомам. Всё хранится в этом браузере.</p>
  </header>

  <section class='card total' aria-live='polite'>
    <div>
      <span class='label'>Всего в логове</span>
      <strong id='grandTotal'>0</strong>
    </div>
    <ul id='categoryTotals' class='chips'></ul>
  </section>

  <section class='card'>
    <h2>Добавить находку</h2>
    <form id='addForm' class='add-form'>
      <label>Биом
        <select id='biome' required></select>
      </label>
      <label>Предмет
        <select id='item' required></select>
      </label>
      <label>Количество
        <input id='count' type='number' min='1' max='9999' value='1' required>
      </label>
      <button type='submit'>Положить в логово</button>
    </form>
    <p id='formError' class='error' role='alert'></p>
  </section>

  <section class='card'>
    <h2>По биомам</h2>
    <div id='biomes' class='biomes'></div>
  </section>

  <footer>
    <button id='resetBtn' type='button' class='ghost'>Очистить логово</button>
  </footer>
</main>
<script src='app.js'></script>
</body>
</html>
